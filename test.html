<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Test Glide - FIXED</title>
    <!-- Подключаем стили Glide -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@glidejs/glide/dist/css/glide.core.min.css">
    <style>
      /* Базовые стили для наглядности */
      body { font-family: sans-serif; padding: 20px; }

      /* Контейнер слайдера */
      .glide {
        width: 400px;
        max-width: 100%;
        margin-bottom: 40px;
        position: relative;
      }

      /* КРИТИЧЕСКИ ВАЖНО: Сбрасываем overflow у трека */
      .glide .glide__track {
        overflow: visible !important; /* Разрешаем видеть слайды за пределами */
        width: 100% !important;
      }

      /* Слайд: запрещаем сжиматься */
      .glide .glide__slide {
        width: 100% !important;       /* Каждый слайд занимает 100% ширины контейнера */
        margin: 0 !important;
        flex-shrink: 0;               /* Главное: слайд не должен сжиматься */
      }

      /* Картинка внутри слайда */
      .glide .glide__slide img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
      }

      /* Кнопки (базовый стиль, чтобы они были видны) */
      .glide__arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255,255,255,0.8);
        border: 1px solid #ccc;
        cursor: pointer;
        padding: 10px;
        z-index: 10;
      }
      .glide__arrow--left { left: 10px; }
      .glide__arrow--right { right: 10px; }
    </style>
  </head>
  <body>

    <h2>Слайдер 1 (Проверка работы)</h2>
    <div id="glide-history" class="glide">
      <div class="glide__track" data-glide-el="track">
        <ul class="glide__slides">
          <!-- Слайд 1 -->
          <li class="glide__slide">
            <img src="media/fh.jpg" alt="Slide 1">
          </li>
          <!-- Слайд 2 -->
          <li class="glide__slide">
            <img src="media/swaston.jpg" alt="Slide 2">
          </li>
        </ul>
      </div>

      <!-- Кнопки навигации -->
      <div class="glide__arrows" data-glide-el="controls">
        <button class="glide__arrow glide__arrow--left" data-glide-dir="<">‹</button>
        <button class="glide__arrow glide__arrow--right" data-glide-dir=">">›</button>
      </div>
    </div>

    <h2>Слайдер 2 (Проверка с картинкой)</h2>
    <div id="glide-nazva" class="glide" style="width: 300px;">
      <div class="glide__track" data-glide-el="track">
        <ul class="glide__slides">
          <!-- Заменил на заглушку, чтобы точно видеть картинку -->
          <li class="glide__slide">
            <img src="media/nazva.png" alt="Nazva">
          </li>
        </ul>
      </div>
      <div class="glide__arrows" data-glide-el="controls">
        <button class="glide__arrow glide__arrow--left" data-glide-dir="<">‹</button>
        <button class="glide__arrow glide__arrow--right" data-glide-dir=">">›</button>
      </div>
    </div>

    <!-- Подключаем библиотеку -->
    <script src="https://cdn.jsdelivr.net/npm/@glidejs/glide/dist/glide.min.js"></script>

    <!-- Инициализация -->
    <script>
      // Инициализируем слайдеры
      const glide1 = new Glide('#glide-history', {
        type: 'slider',
        perView: 1,
        gap: 10,
        rewind: false
      }).mount();

      const glide2 = new Glide('#glide-nazva', {
        type: 'slider',
        perView: 1,
        gap: 10
      }).mount();

      console.log('Слайдеры готовы. Попробуй нажать кнопки.');
    </script>
  </body>
</html>
