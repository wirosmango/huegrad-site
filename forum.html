<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Форум</title>
    <meta charset="utf-8" />
    <link href="./style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" type="image/png" href="huegrad/images/пиздюк.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>
</style>
<body>
  <header>
        <button class="backtohome">
            <a href="index.html"><h1>Хуеград</h1></a>
        </button>
        <button class="burger-btn" id="burgerBtn" aria-label="Меню">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="top-menu" id="topMenu">
            <a href="index.html">Главная</a>
            <a href="drochka.html">Дрочка</a>
            <a href="mods/">Доп. ресурсы</a>
            <a href="news.html">Новости</a>
            <a href="history.html">История Хуеграда</a>
            <a href="obrazovanie.html">Образование в Хуеграде</a>
            <a href="pizdjuk.html">Пиздюк</a>
            <a href="forum.html">Форум</a>
        </nav>
    </header>
    <div class="title">
        <h1 class="animated-gradient">Форум</h1>
    </div>
    <button class="topics-toggle-btn" id="topicsToggleBtn">☰ Темы</button>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <h2>Темы</h2>
        <input id="topicTitle" placeholder="Новая тема" maxlength="100">
        <button id="createTopicBtn">Создать</button>
        <div id="topicsList"></div>
      </aside>
      
      <main class="content" id="content">
        <h1>Выберите тему</h1>
      </main>
    </div>

  <script type="module" src="forum.js"></script>
  <script>
        const burgerBtn = document.getElementById('burgerBtn');
        const topMenu = document.getElementById('topMenu');

        burgerBtn.addEventListener('click', () => {
            burgerBtn.classList.toggle('active');
            topMenu.classList.toggle('active');
        });
  </script>
  <script>
        document.addEventListener('DOMContentLoaded', () => {
          const topicsToggleBtn = document.getElementById('topicsToggleBtn');
          const sidebar = document.getElementById('sidebar');
          
          if (topicsToggleBtn && sidebar) {
            topicsToggleBtn.addEventListener('click', () => {
              sidebar.classList.toggle('active');
          });
          
          sidebar.addEventListener('click', (e) => {
            if (e.target.classList.contains('topic-item')) {
              sidebar.classList.remove('active');
            }
          });
        }
      });
  </script> 
</body>
</html>
