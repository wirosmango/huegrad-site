<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Форум</title>
    <meta charset="utf-8" />
    <link href="./style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" type="image/png" href="huegrad/images/пиздюк.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>
</style>
<body>
  <header>
        <button class="backtohome">
            <a href="index.html"><h1>Хуеград</h1></a>
        </button>
        <button class="burger-btn" id="burgerBtn" aria-label="Меню">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="top-menu" id="topMenu">
            <a href="index.html">Главная</a>
            <a href="drochka.html">Дрочка</a>
            <a href="mods/">Доп. ресурсы</a>
            <a href="news.html">Новости</a>
            <a href="history.html">История Хуеграда</a>
            <a href="ptu.html">Образование в Хуеграде</a>
            <a href="pizdjuk.html">Пиздюк</a>
            <a href="forum.html">Форум</a>
        </nav>
    </header>
    <div class="title">
        <h1 class="animated-gradient">Форум</h1>
    </div>
    <div class="news">
      <div class="post">
        <input id="nickname" placeholder="Ваш ник" maxlength="30">
        <div class="input-wrapper">
          <textarea id="message" placeholder="Сообщение" maxlength="2000"></textarea>
          <button id="sendBtn">
            <svg xmlns="http://www.w3.org/2000/svg" 
            width="24" 
            height="24" 
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            class="lucide lucide-send-horizontal-icon lucide-send-horizontal">
            <path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z"/>
            <path d="M6 12h16"/>
            </svg>
          </button>
        </div>
        
        <div id="posts"></div>
      </div>
    </div>

  <script type="module" src="forum.js"></script>
  <script>
        const burgerBtn = document.getElementById('burgerBtn');
        const topMenu = document.getElementById('topMenu');

        burgerBtn.addEventListener('click', () => {
            burgerBtn.classList.toggle('active');
            topMenu.classList.toggle('active');
        });
    </script>
</body>
</html>
