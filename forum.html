<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Форум</title>
    <meta charset="utf-8" />
    <link href="./style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" type="image/png" href="media/пиздюк.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
</head>
<body>
  <header>
        <button class="backtohome">
            <a href="forum.html"><h1>Форум</h1></a>
        </button>
        <button class="burger-btn" id="burgerBtn" aria-label="Меню">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="top-menu" id="topMenu">
            <a href="index.html">Главная</a>
            <a href="drochka.html">Дрочка</a>
            <a href="mods/">Доп. ресурсы</a>
            <a href="news.html">Новости</a>
            <a href="history.html">История Хуеграда</a>
            <a href="obrazovanie.html">Образование в Хуеграде</a>
            <a href="pizdjuk.html">Пиздюк</a>
            <a href="forum.html">Форум</a>
        </nav>
    </header>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <h2>Темы</h2>
        <input id="topicTitle" placeholder="Новая тема" maxlength="100">
        <button id="createTopicBtn">Создать</button>
        <div id="topicsList">
          <div class="spinner-wrap">
            <div class="spinner"></div>
          </div>
        </div>
      </aside>
      
      <main class="content" id="content">
        <div class="topic-header">
          <h1>Выберите тему</h1>
          <button class="topics-toggle-btn" id="topicsToggleBtn" aria-label="Темы">☰</button>
        </div>
      </main>
    </div>

  <script type="module" src="forum.js"></script>
  <script>
        const burgerBtn = document.getElementById('burgerBtn');
        const topMenu = document.getElementById('topMenu');

        burgerBtn.addEventListener('click', () => {
            burgerBtn.classList.toggle('active');
            topMenu.classList.toggle('active');
        });
  </script>
</body>
</html>
